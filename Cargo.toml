[package]
name = "ytmplayer"
version = "3.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Osyna/YTM-Player"

[dependencies]
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
parking_lot = "0.12.5"
serde_json = "1.0.151"

[profile.release]
# A single codegen unit plus cross-crate inlining: the binary is small enough that the extra
# build time is cheap, and it lets the JSON and rendering paths inline into each other.
lto = true
codegen-units = 1
strip = true
